name: ci

# Two-OS validation of the ~/.claude workbench (P6-T7). Every future change is
# checked on ubuntu AND windows, against the trigger floor, the portability
# grep-gates, and the full test suite — so a trigger loss, an edited upstream-
# locked skill, or a non-portable literal becomes a build failure forever.
# Ubuntu runs the lowest supported, the current and the newest Python (audit
# 2026-10-05 I-14); Windows runs the current and the newest (audit 2026-10-06 A6-05).
# Actions are pinned to commit SHAs (tag in the comment).

on:
  push:
    branches: [main, "100x-overhaul"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workbench:
    name: workbench (${{ matrix.os }}, py ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: windows-latest, python: "3.12"}
          - {os: windows-latest, python: "3.14"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "24"

      # Tooling deps: PyYAML powers the skill-validator front-matter parser
      # (R2/R5/R6/R10 fidelity — runtime hooks are pure stdlib and never need it;
      # skills_lib degrades to a stdlib fallback without it, but the R10 baselines
      # want yaml's exact scalar folding). pytest runs the test suite step below.
      - name: Install Python tooling (pyyaml validator dep + pytest runner)
        run: python -m pip install --quiet pyyaml pytest

      # Read-only installer planning (every mutating step reported as WOULD-*).
      # Never run bare install.py here: without --ci it starts the web UI.
      - name: Installer plan (dry-run)
        run: python installer/deps.py

      - name: Doctor (hook-fire matrix + trigger-surface + model routing)
        run: python installer/doctor.py --ci
        env:
          CLAUDE_HOOK_DOCTOR: "1"

      # No settings.json exists on a runner: render one into a temp file and prove the
      # semantic check against exactly that file + overlay (audit A-11 / I-15).
      - name: Render settings.json to a temp file and --check it
        shell: bash
        run: |
          python installer/render.py --out "$RUNNER_TEMP/settings.json" --user "$RUNNER_TEMP/no-overlay.json"
          python installer/render.py --check --out "$RUNNER_TEMP/settings.json" --user "$RUNNER_TEMP/no-overlay.json"

      - name: Validate skills (R9 floor guard + R10 upstream-intactness)
        run: python scripts/validate_skills.py

      - name: Trigger floor is a verbatim superset
        run: python hooks/build-trigger-floor.py --check

      - name: Generated skills + agent blocks in sync
        run: |
          python hooks/gen-invoke-skills.py --check
          python hooks/gen-agent-skill-blocks.py --check

      - name: Portability grep-gates (no sys.platform outside platform.py; no home/drive literals; no new .sh)
        run: python scripts/grep_gates.py

      - name: Tests (platform, prompt-router, dispatch parity, index-lifecycle, model-guard, installer, doctor)
        run: python -m pytest tests/ hooks/tests/ -q
        env:
          CLAUDE_HOOK_DOCTOR: "1"

      # Full headless install in a throwaway HOME (audit I-06): bootstrap relocates a
      # copy of the checkout into $CLAUDE_CONFIG_DIR and self-heals there; network
      # steps are planned. The checkout itself must come out untouched.
      - name: Sandboxed install.py --ci rehearsal
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/home" CLAUDE_CONFIG_DIR="$RUNNER_TEMP/home/.claude"
          mkdir -p "$HOME"
          python install.py --ci
          git diff --exit-code

      # Same rehearsal through the one-click entry (install.ps1 -Ci runs install.py --ci).
      # Path.home() reads USERPROFILE on Windows, so HOME alone would not sandbox it;
      # AGENTIC_MERCY_SANDBOX keeps every tool dir inside the throwaway profile. pwsh reports
      # only the LAST native exit code, hence a check after each command (audit A6-06).
      - name: Sandboxed install.ps1 -Ci rehearsal (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # install.ps1 picks `py -3` (the runner's NEWEST Python, not this leg's); -Ci plans the PyYAML
          # install, so give that interpreter the validator dependency the earlier pip step gave this one
          py -3 -m pip install --quiet pyyaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $h = Join-Path $env:RUNNER_TEMP 'home'
          New-Item -ItemType Directory -Force (Join-Path $h '.claude'), (Join-Path $h 'AppData\Local'), (Join-Path $h 'AppData\Roaming') | Out-Null
          $env:HOME = $h
          $env:USERPROFILE = $h
          $env:LOCALAPPDATA = Join-Path $h 'AppData\Local'
          $env:APPDATA = Join-Path $h 'AppData\Roaming'
          $env:CLAUDE_CONFIG_DIR = Join-Path $h '.claude'
          $env:AGENTIC_MERCY_SANDBOX = '1'
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The mods (in-process TypeScript plugins) run nowhere else automatically (audit I-04):
  # the claude CLI pinned to manifest mods.claude_version validates the plugin and runs its
  # *.test.ts through `claude plugin test`. The tsc step below only runs once the engine has
  # laid .claude-plugin/types, which neither `plugin validate` nor `plugin test` does (audit
  # A6-04), so a skip is announced as a warning instead of passing silently. The Windows leg
  # is informational for its first 5 green runs (audit A6-07).
  mods:
    name: mods (${{ matrix.os }}, claude plugin test + tsc)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "24"

      # validate_mods.py returns no problems when `claude` is not on PATH, so prove the CLI first.
      - name: Install the pinned Claude Code CLI + TypeScript
        shell: bash
        run: |
          ver=$(python -c "import json; print(json.load(open('installer/manifest.json'))['mods']['claude_version'])")
          npm install -g "@anthropic-ai/claude-code@$ver" typescript
          claude --version | grep -F "$ver" || { echo "::error::claude-code@$ver is not the claude on PATH after npm install"; exit 1; }

      - name: Mod contract + plugin validate + mod tests
        run: python scripts/validate_mods.py

      - name: Mod type-check
        shell: bash
        run: |
          for id in $(python -c "import json; print(' '.join(json.load(open('installer/manifest.json'))['mods']['enabled']))"); do
            if [ -d "mods/$id/.claude-plugin/types" ]; then tsc -p "mods/$id" --noEmit; else echo "::warning title=tsc skipped::mods/$id has no engine-laid .claude-plugin/types"; fi
          done
